<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ptGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#ptGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
  
  <!-- Subtle Medical Cross Accent -->
  <path d="M32 14v36M14 32h36" stroke="rgba(255,255,255,0.12)" stroke-width="6" stroke-linecap="round"/>

  <!-- Dynamic ECG / Supply Pulse Waveform -->
  <path d="M14 32h8l3-7 6 15 5-11 3 5 4-2h7" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Signal Node Indicator -->
  <circle cx="50" cy="32" r="3" fill="#22d3ee" />
</svg>
